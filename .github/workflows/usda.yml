name: USDA NASS 价格自动抓取

on:
  schedule:
    # 每周一 00:00 UTC = 北京时间周一 08:00(早上)运行;NASS 月度数据更新频率低,每周足够
    # 注:GitHub Actions 高峰期 cron 可能延迟几分钟到几十分钟,属正常
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # 也支持在 Actions 页面手动点 Run

permissions:
  contents: write          # 允许把抓到的数据提交回仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 同步最新 main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取脚本
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FX_USD_CNY: "6.77"
        run: python fetch_usda.py

      - name: 提交更新的数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "数据自动更新 $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: 检查邮件配置
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_USERNAME SMTP_PASSWORD MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: 发送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/send_email.py \
            --subject "USDA NASS 畜牧饲料价格自动周报" \
            --body "您好，附件为本周自动抓取并整理的 USDA NASS 畜牧饲料价格数据。Excel 包含说明页和各品类整理表，CSV 为所有品类合并长表；原始 CSV 已同步存档在仓库 data/raw/ 目录。" \
            --attachments "data/USDA畜牧饲料价格_自动更新.xlsx" "data/USDA_价格_合并长表.csv"
