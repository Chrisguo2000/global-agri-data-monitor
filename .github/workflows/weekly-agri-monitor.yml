name: 各国农业数据自动周报

on:
  schedule:
    # 每周一 00:00 UTC = 北京时间周一 08:00
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-agri-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 同步最新 main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 USDA NASS 抓取
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FX_USD_CNY: "6.77"
        run: python fetch_usda.py

      - name: 抓取农业农村部最新文章
        run: node scripts/scrape_moa_jcyj.mjs --out-dir=dist/moa --pages=1

      - name: 合并农业农村部历史基线
        run: |
          python scripts/merge_moa_data.py \
            --baseline data/moa/baseline_moa_jcyj_data.json \
            --latest dist/moa/moa_jcyj_data.json \
            --output dist/moa/moa_jcyj_data_merged.json

      - name: 生成农业农村部 Excel
        run: |
          python scripts/build_moa_workbook.py \
            --input dist/moa/moa_jcyj_data_merged.json \
            --template templates/moa_chart_format_template.xlsx \
            --output dist

      - name: 汇总本次输出路径
        run: |
          USDA_XLSX="$(ls -1t data/USDA农业数据_*.xlsx | head -n 1)"
          USDA_CSV="$(ls -1t data/USDA农业数据_*_合并长表.csv | head -n 1)"
          MOA_XLSX="$(ls -1t dist/农业农村部监测预警数据汇总_*_清洗版.xlsx | head -n 1)"
          for file in "$USDA_XLSX" "$USDA_CSV" "$MOA_XLSX" dist/moa/moa_jcyj_data_merged.json; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              echo "::error::缺少本次输出文件: $file"
              exit 1
            fi
          done
          echo "USDA_XLSX=$USDA_XLSX" >> "$GITHUB_ENV"
          echo "USDA_CSV=$USDA_CSV" >> "$GITHUB_ENV"
          echo "MOA_XLSX=$MOA_XLSX" >> "$GITHUB_ENV"

      - name: 生成各国合并看板数据
        run: |
          python scripts/build_china_us_agri_dashboard_data.py \
            --moa-json dist/moa/moa_jcyj_data_merged.json \
            --usda-csv "$USDA_CSV" \
            --output dist/dashboard/data/dashboard-data.json

      - name: 打包各国合并看板
        run: |
          python scripts/prepare_china_us_dashboard.py \
            --template dashboard/中美农业数据监测看板.html \
            --data dist/dashboard/data/dashboard-data.json \
            --output-dir dist/dashboard \
            --zip-name 各国农业数据监测看板.zip

      - name: 提交更新的数据
        run: |
          cp dist/moa/moa_jcyj_data_merged.json data/moa/baseline_moa_jcyj_data.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "数据自动更新 $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: 检查邮件配置
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_USERNAME SMTP_PASSWORD MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: 发送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/send_email.py \
            --subject "各国农业数据自动周报" \
            --body "您好，附件为本周自动生成的各国农业数据周报：1) USDA Excel；2) 农业农村部 Excel；3) 各国合并看板 zip；4) 看板所用 dashboard-data.json。看板 zip 解压后直接打开 HTML 即可，不需要手动上传数据文件。" \
            --attachments "$USDA_XLSX" "$MOA_XLSX" "dist/各国农业数据监测看板.zip" "dist/dashboard/data/dashboard-data.json"

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-agri-monitor-output
          path: |
            data/USDA农业数据_*.xlsx
            data/USDA农业数据_*_合并长表.csv
            dist/*.xlsx
            dist/*.zip
            dist/dashboard/data/dashboard-data.json
            dist/moa/moa_jcyj_data.json
            dist/moa/moa_jcyj_data_merged.json
