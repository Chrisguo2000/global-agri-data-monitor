name: 各国农业数据自动周报

on:
  schedule:
    # 每周一 00:00 UTC = 北京时间周一 08:00
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-agri-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 同步最新 main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Playwright 并检测 Chrome
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            google-chrome-stable --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium-browser)" >> "$GITHUB_ENV"
            chromium-browser --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            npx playwright install --with-deps chromium
          fi

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 USDA NASS 抓取
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          FX_USD_CNY: "6.77"
        run: python fetch_usda.py

      - name: 抓取农业农村部最新文章
        run: node scripts/scrape_moa_jcyj.mjs --out-dir=dist/moa --pages=1

      - name: 合并农业农村部历史基线
        run: |
          python scripts/merge_moa_data.py \
            --baseline data/moa/baseline_moa_jcyj_data.json \
            --latest dist/moa/moa_jcyj_data.json \
            --output dist/moa/moa_jcyj_data_merged.json

      - name: 生成农业农村部 Excel
        run: |
          python scripts/build_moa_workbook.py \
            --input dist/moa/moa_jcyj_data_merged.json \
            --template templates/moa_chart_format_template.xlsx \
            --output dist

      - name: 抓取澳洲公开数据
        env:
          AUSTRALIA_MLA_INCREMENTAL_LOOKBACK_MONTHS: "18"
          AUSTRALIA_MLA_API_WORKERS: "4"
          AUSTRALIA_MLA_API_RETRY_ATTEMPTS: "6"
          AUSTRALIA_MLA_API_RETRY_SECONDS: "3"
          AUSTRALIA_PORK_MAX_PDFS: "16"
        run: python scripts/fetch_australia.py --output-dir data

      - name: 汇总本次输出路径
        run: |
          US_XLSX="$(ls -1t data/美国农业数据_*.xlsx | head -n 1)"
          US_CSV="$(ls -1t data/美国农业数据_*_合并长表.csv | head -n 1)"
          CN_XLSX="$(ls -1t dist/中国农业数据_*.xlsx | head -n 1)"
          AU_CSV="$(ls -1t data/澳洲农业数据_*_合并长表.csv | head -n 1)"
          for file in "$US_XLSX" "$US_CSV" "$CN_XLSX" "$AU_CSV" dist/moa/moa_jcyj_data_merged.json; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              echo "::error::缺少本次输出文件: $file"
              exit 1
            fi
          done
          echo "US_XLSX=$US_XLSX" >> "$GITHUB_ENV"
          echo "US_CSV=$US_CSV" >> "$GITHUB_ENV"
          echo "CN_XLSX=$CN_XLSX" >> "$GITHUB_ENV"
          echo "AU_CSV=$AU_CSV" >> "$GITHUB_ENV"

      - name: 生成澳洲 Excel
        run: |
          python scripts/build_australia_workbook.py \
            --input "$AU_CSV" \
            --output-dir dist
          AU_XLSX="$(ls -1t dist/澳洲农业数据_*.xlsx | head -n 1)"
          if [ -z "$AU_XLSX" ] || [ ! -f "$AU_XLSX" ]; then
            echo "::error::缺少澳洲 Excel 输出"
            exit 1
          fi
          echo "AU_XLSX=$AU_XLSX" >> "$GITHUB_ENV"

      - name: 生成各国合并看板数据
        run: |
          python scripts/build_china_us_agri_dashboard_data.py \
            --moa-json dist/moa/moa_jcyj_data_merged.json \
            --usda-csv "$US_CSV" \
            --australia-csv "$AU_CSV" \
            --output dist/dashboard/data/dashboard-data.json

      - name: 打包各国合并看板
        run: |
          python scripts/prepare_china_us_dashboard.py \
            --template dashboard/中美农业数据监测看板.html \
            --data dist/dashboard/data/dashboard-data.json \
            --output-dir dist/dashboard \
            --zip-name 各国农业数据监测看板.zip

      - name: 提交更新的数据
        run: |
          cp dist/moa/moa_jcyj_data_merged.json data/moa/baseline_moa_jcyj_data.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "数据自动更新 $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: 检查邮件配置
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_USERNAME SMTP_PASSWORD MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: 发送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/send_email.py \
            --subject "各国农业数据自动周报" \
            --body "您好，附件为本周自动生成的各国农业数据周报：1) 美国USDA Excel；2) 中国农业农村部 Excel；3) 澳洲农业数据 Excel；4) 各国合并看板 zip；5) 看板所用 dashboard-data.json。看板 zip 解压后直接打开 HTML 即可，不需要手动上传数据文件。" \
            --attachments "$US_XLSX" "$CN_XLSX" "$AU_XLSX" "dist/各国农业数据监测看板.zip" "dist/dashboard/data/dashboard-data.json"

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-agri-monitor-output
          path: |
            data/美国农业数据_*.xlsx
            data/美国农业数据_*_合并长表.csv
            data/澳洲农业数据_*_合并长表.csv
            dist/*.xlsx
            dist/*.zip
            dist/dashboard/data/dashboard-data.json
            dist/moa/moa_jcyj_data.json
            dist/moa/moa_jcyj_data_merged.json
